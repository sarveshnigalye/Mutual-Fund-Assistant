# Tests on every push / PR. Railway's "Wait for CI" can gate deploys on this workflow.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: "1"
      VECTOR_DB_PROVIDER: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11" # same as the refresh workflow and the Railway runtime
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-ingest.txt
      - name: Fetch the published index (Phase 6 integration tests use it when present)
        run: |
          git fetch --depth=1 origin "+refs/heads/data-snapshot:refs/remotes/origin/data-snapshot" \
            && git archive refs/remotes/origin/data-snapshot data | tar -x \
            || echo "No data-snapshot yet: index-dependent tests will skip."
      - name: Run tests
        run: python -m pytest -q -p no:cacheprovider -rfEs

  runtime-install:
    # What Railway installs: only requirements.txt. The app must import and start without the
    # ingestion extras (Selenium, ChromaDB, pytest).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt
      - name: Import the app without ingestion extras
        run: |
          python - <<'EOF'
          import importlib.util, sys
          for mod in ("selenium", "chromadb", "pytest"):
              assert importlib.util.find_spec(mod) is None, f"{mod} should not be a runtime dependency"
          import app.main  # noqa: F401  (builds the FastAPI app, routers, middleware)
          from app.core.retriever import MutualFundRetriever  # noqa: F401
          print("runtime imports OK on", sys.version)
          EOF
