# Phase 7 — Daily data refresh.
# Rebuilds the knowledge base from the live Groww pages every day at 10:00 IST:
#   scrape → normalize → clean → chunk → embed → store (staging) → validate → publish
# and force-pushes the validated index as a single commit to the orphan `data-snapshot` branch.
# A failure at any stage stops before publishing, so the previous snapshot stays live.
#
# Scheduled runs only start from the default branch. Manual run: Actions tab → "Daily data
# refresh" → Run workflow, or `gh workflow run daily-data-refresh.yml`.
name: Daily data refresh

on:
  schedule:
    - cron: "30 4 * * *" # 04:30 UTC = 10:00 IST (no DST). GitHub may start it 5–30 min late.
  workflow_dispatch: {}

permissions:
  contents: write # push the data-snapshot branch
  issues: write # failure alerts

concurrency:
  group: daily-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Kolkata # scrape_date is the IST date
      BROWSER_TYPE: chrome # Chrome + chromedriver are preinstalled on ubuntu-latest
      VECTOR_DB_PROVIDER: chromadb
      VECTORSTORE_COLLECTION: mf_faq_corpus
      SCRAPE_DELAY_SECONDS: "3"
      PYTHONUNBUFFERED: "1"
      # Ingestion uses local TF-IDF/BM25 embeddings: no API keys are needed.
      # Optional: the deployed API's refresh endpoint (Railway). Empty = the notify step is skipped.
      # Job-level because a step's `if:` can't see its own `env:` and `secrets` isn't allowed in `if:`.
      RAILWAY_REFRESH_URL: ${{ secrets.RAILWAY_REFRESH_URL }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        id: setup
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ingest.txt
          if [ -n "${CHROMEWEBDRIVER:-}" ] && [ -x "$CHROMEWEBDRIVER/chromedriver" ]; then
            echo "CHROME_DRIVER_PATH=$CHROMEWEBDRIVER/chromedriver" >> "$GITHUB_ENV"
          fi

      - name: Fetch previous snapshot (for the diff)
        run: git fetch --depth=1 origin "+refs/heads/data-snapshot:refs/remotes/origin/data-snapshot" || echo "No data-snapshot branch yet (first run)."

      - name: Scrape → normalize → clean → chunk → embed → store (staging)
        id: ingest
        run: python scripts/ingest.py --staging --run-id "$GITHUB_RUN_ID" --summary "$GITHUB_STEP_SUMMARY"

      - name: Validation gate
        id: validate
        run: >-
          python scripts/validate_index.py --staging
          --previous origin/data-snapshot
          --require-fresh --require-chroma
          --summary "$GITHUB_STEP_SUMMARY"

      - name: Promote staging and publish snapshot
        id: publish
        run: python scripts/publish_snapshot.py --branch data-snapshot --summary "$GITHUB_STEP_SUMMARY"

      - name: Tell the deployed app to load the new snapshot
        id: notify
        if: success() && env.RAILWAY_REFRESH_URL != ''
        env:
          RAILWAY_REFRESH_TOKEN: ${{ secrets.RAILWAY_REFRESH_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 20 --max-time 60 \
               -X POST "$RAILWAY_REFRESH_URL" \
               -H "Authorization: Bearer $RAILWAY_REFRESH_TOKEN"
          echo "- 🚀 Deployed app notified: \`$RAILWAY_REFRESH_URL\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload data for debugging
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: data-snapshot-${{ github.run_id }}
          path: |
            data/
            !data/chat.db
          retention-days: 14
          if-no-files-found: ignore

      - name: Close open failure issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/report_failure.py --resolve --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          STEPS_JSON: ${{ toJSON(steps) }}
        run: python scripts/report_failure.py --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
